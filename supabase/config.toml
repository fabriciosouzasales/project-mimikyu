
# Fronteira de identidade (2026-08-13, Finding 1 da auditoria de segurança do
# Catálogo Editorial): as duas functions abaixo eram deployadas com
# verify_jwt=false e sem nenhuma validação de admin no handler — SERVICE_ROLE
# acessível por qualquer chamador que soubesse a URL pública. verify_jwt=true
# aqui só garante um JWT assinado válido (pode ser a própria anon key, sem
# usuário nenhum por trás) — a validação real de admin (auth.getUser() +
# rpc('is_admin')) vive no próprio index.ts de cada function, mesmo padrão já
# em produção em revalidate-catalog-import-rows (Query 2106 v1.1).
[functions.import-catalog-cards]
enabled = true
verify_jwt = true
import_map = "./functions/import-catalog-cards/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/import-catalog-cards/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/import-catalog-cards/*.html" ]

[functions.import-card-assets]
enabled = true
verify_jwt = true
import_map = "./functions/import-card-assets/deno.json"
entrypoint = "./functions/import-card-assets/index.ts"

# import-card-variants (2026-08-15, Incremento 2 do bloco Card Variant,
# ADR-028): mesma fronteira de identidade das duas functions acima —
# verify_jwt=true garante um JWT assinado válido; a validação real de
# admin (auth.getUser() + rpc('is_admin')) vive no próprio index.ts.
[functions.import-card-variants]
enabled = true
verify_jwt = true
import_map = "./functions/import-card-variants/deno.json"
entrypoint = "./functions/import-card-variants/index.ts"

# ptax-fx-refresh (2026-08-18, Incremento P13.3, ADR-031): PRIMEIRA function deste
# projeto com verify_jwt=false por decisão arquitetural deliberada, não por descuido —
# as chaves atuais do projeto (formato sb_secret_.../sb_publishable_...) não são JWT,
# então verify_jwt=true rejeitaria QUALQUER chamador, inclusive o agendador legítimo.
# A fronteira de identidade real aqui é um segredo dedicado desta function
# (PTAX_FX_REFRESH_SECRET, Function Secret do Supabase — nunca a publishable key),
# validado no header "apikey" por comparação manual em tempo constante dentro do
# próprio handler (ver ptax-fx-refresh/auth.ts) — nunca @supabase/server. Execução
# sempre registra triggered_by=SCHEDULED, confirmed_by=NULL em pricing_sync_run (nunca
# um admin humano por trás desta chamada).
[functions.ptax-fx-refresh]
enabled = true
verify_jwt = false
import_map = "./functions/ptax-fx-refresh/deno.json"
entrypoint = "./functions/ptax-fx-refresh/index.ts"

# justtcg-price-refresh (2026-08-21, Incremento de Atualização Diária JustTCG, item C):
# mesma fronteira de identidade de ptax-fx-refresh acima — verify_jwt=false por decisão
# arquitetural deliberada (chaves sb_secret_.../sb_publishable_... não são JWT), com
# autorização real via segredo dedicado (JUSTTCG_PRICE_REFRESH_SECRET, Function Secret do
# Supabase), validado no header "apikey" por comparação manual em tempo constante (ver
# justtcg-price-refresh/auth.ts) — nunca @supabase/server. Execução sempre registra
# triggered_by=SCHEDULED, confirmed_by=NULL em pricing_sync_run (run_type=PRICE_REFRESH).
# O corpo aceita SOMENTE { waveNumber: 1..5 } — nunca URL/segredo/chave em payload; os 5
# jobs pg_cron diários que chamam esta função (item E) ficam para uma migration separada,
# PROPOSTA e não aplicada nesta rodada.
[functions.justtcg-price-refresh]
enabled = true
verify_jwt = false
import_map = "./functions/justtcg-price-refresh/deno.json"
entrypoint = "./functions/justtcg-price-refresh/index.ts"

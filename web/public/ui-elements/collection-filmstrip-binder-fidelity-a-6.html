<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>MMKYU Collector — Binder Fidelity A (Binder MMKYU)</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      background: #121212;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #121212;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px) 50% 0 / 25% 100%,
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 109px,
          rgba(255, 255, 255, 0.045) 110px,
          transparent 111px
        ),
        radial-gradient(circle at var(--pointer-x) 48%, rgba(255, 255, 255, 0.06), transparent 34%),
        #121212;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.16;
      background:
        repeating-radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.17) 0 0.5px, transparent 0.7px 4px),
        repeating-radial-gradient(circle at 78% 71%, rgba(255, 255, 255, 0.22) 0 0.5px, transparent 0.8px 5px);
      mix-blend-mode: soft-light;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.4),
        transparent 14%,
        transparent 86%,
        rgba(0, 0, 0, 0.4)
      );
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(154px, 16.8vw, 238px);
      aspect-ratio: 0.72;
      padding: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #f3f0e9;
      /* Textura portada de binder-cover-closed.tsx (BLACK_HUE=30,
         closedCoverWeave(), lightness da capa frontal [15,10,6]) — mesma
         receita de cor do Binder fechado aprovado, reaplicada como CSS 2D
         estático (o componente 3D original não foi tocado/importado). */
      background-image: radial-gradient(135% 90% at 20% 6%, hsl(0 0% 100% / 0.05) 0%, transparent 46%), repeating-linear-gradient(23deg, hsl(0 0% 100% / 0.018) 0px, hsl(0 0% 100% / 0.018) 1px, transparent 1px, transparent 2px), repeating-linear-gradient(157deg, hsl(0 0% 0% / 0.03) 0px, hsl(0 0% 0% / 0.03) 1px, transparent 1px, transparent 2px), linear-gradient(150deg, hsl(30 6% 15%) 0%, hsl(30 5% 10%) 55%, hsl(30 6% 6%) 100%);
      background-color: hsl(30 6% 6%);
      box-shadow:
        0 calc(10px + var(--focus) * 24px) calc(18px + var(--focus) * 36px)
          rgba(0, 0, 0, calc(0.3 + var(--focus) * 0.34)),
        inset 0 1px 0 hsl(0 0% 100% / 0.06),
        inset 0 -3px 10px hsl(0 0% 0% / 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    /* Costura periférica — porta 1:1 a "costura periférica" de
       binder-cover-closed.tsx (inset 9, 1.25px dashed, opacidade 0.1).
       Estática (não reage a --focus): é um detalhe de material permanente,
       não um indicador de foco de teclado — esse papel continua só com
       .card:focus-visible, abaixo. Substitui a antiga borda genérica
       reativa a --focus (nenhuma cor de identidade por Collection aqui). */
    .card::before {
      content: "";
      position: absolute;
      inset: 9px;
      z-index: 3;
      border: 1.25px dashed hsl(0 0% 100% / 0.1);
      border-radius: 10px;
      pointer-events: none;
    }

    .card:focus-visible {
      box-shadow:
        0 26px 50px rgba(0, 0, 0, 0.5),
        0 0 0 4px rgba(221, 165, 75, 0.5);
    }

    /* Portrait deixa de ser um container de <img> — a textura do .card já
       cobre toda a superfície (é o "material" do mini binder); esta camada
       só hospeda a marca d'água central. */
    .portrait {
      position: absolute;
      inset: 7px 7px 25%;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    /* Marca d'água — mesma técnica debossed de MmkyuWordmark.tsx
       (textShadow claro acima + escuro abaixo, uppercase, letter-spacing
       0.28em), centralizada e em opacidade baixa. Não muda entre Light/Dark
       do spike porque o Binder mantém sua própria identidade/material nos
       dois temas (mesma regra já aplicada ao stage vs. card em rodadas
       anteriores) — só o workspace ao redor troca de tema, o card em si é
       sempre este material escuro. */
    .portrait-watermark {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.34em;
      font-size: clamp(11px, 1.55vw, 19px);
      color: hsl(30 8% 42% / 0.32);
      text-shadow: 0 1px 0 hsl(0 0% 100% / 0.05), 0 -1px 1px hsl(0 0% 0% / 0.45);
      pointer-events: none;
      user-select: none;
    }

    .footer {
      position: absolute;
      right: 7px;
      bottom: 7px;
      left: 7px;
      height: calc(25% - 7px);
      display: grid;
      grid-template-columns: clamp(26px, 3.2vw, 43px) 1fr;
      align-items: center;
      gap: clamp(6px, 0.7vw, 11px);
      padding: clamp(7px, 0.8vw, 12px);
      color: #f3f0e9;
      background: rgba(0, 0, 0, 0.82);
      text-align: left;
    }

    /* Círculo de progresso — substitui o antigo badge numérico sequencial
       (que tinha borda dourada fixa, "borda colorida" pedida para sair).
       Anel discreto (stroke neutro morno de baixa opacidade) + fração
       "coletadas/total" no centro — dado de apoio, não protagonista. */
    .progress-ring {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(30px, 3.6vw, 46px);
      aspect-ratio: 1;
    }

    .progress-ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .progress-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 2.2;
    }

    .progress-arc {
      fill: none;
      stroke: hsl(38 30% 58% / 0.55);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 97.4;
      stroke-dashoffset: calc(97.4 - (97.4 * var(--pct, 0) / 100));
    }

    .progress-text {
      position: relative;
      z-index: 1;
      color: rgba(255, 255, 255, 0.8);
      font: 600 clamp(4.5px, 0.46vw, 6.5px)/1 ui-monospace, "SFMono-Regular", monospace;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .meta {
      min-width: 0;
    }

    .name,
    .role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .name {
      color: rgba(255, 255, 255, 0.93);
      font-size: clamp(8px, 0.86vw, 13px);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .role {
      margin-top: clamp(3px, 0.35vw, 5px);
      color: rgba(255, 255, 255, 0.5);
      font-size: clamp(5px, 0.48vw, 7px);
      font-weight: 700;
      letter-spacing: 0.15em;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 560px;
        cursor: ns-resize;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px) 50% 0 / 50% 100%,
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 87px,
            rgba(255, 255, 255, 0.045) 88px,
            transparent 89px
          ),
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.06), transparent 35%),
          #121212;
      }

      .card {
        width: clamp(142px, 47vw, 180px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Faixa de Binders — Minhas Collections">
    <h1 class="sr-only">MMKYU Collector — Minhas Collections (Filmstrip)</h1>
    <p class="sr-only">Arraste, use a roda do mouse ou as setas do teclado para explorar os Binders.</p>
    <div class="deck" id="deck" data-testid="deck"></div>
  </main>

  <script>
    (() => {
      // Coletadas/total — mock com tamanhos aproximados de set histórico
      // real (só pra dar variedade honesta ao anel de progresso; não é
      // dado de catálogo real). progress% recalculado a partir daqui
      // (bate com os valores já usados nas rodadas anteriores).
      const profiles = [
        { name: "Base Set", code: "BASE", collected: 0, total: 102 },
        { name: "Jungle", code: "JUN", collected: 15, total: 64 },
        { name: "Fossil", code: "FOS", collected: 46, total: 62 },
        { name: "Team Rocket", code: "ROCKET", collected: 2, total: 82 },
        { name: "Gym Heroes", code: "GYM", collected: 3, total: 132 },
        { name: "Neo Genesis", code: "NEO", collected: 62, total: 111 }
      ].map((p) => ({ ...p, progress: Math.round((p.collected / p.total) * 100) }));

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Abrir ${profile.name}, ${profile.code}, ${profile.collected} de ${profile.total} completo`);
        card.style.setProperty("--pct", String(profile.progress));
        card.innerHTML = `
          <span class="portrait">
            <span class="portrait-watermark">MMKYU</span>
          </span>
          <span class="footer">
            <span class="progress-ring">
              <svg viewBox="0 0 36 36" aria-hidden="true">
                <circle class="progress-track" cx="18" cy="18" r="15.5"></circle>
                <circle class="progress-arc" cx="18" cy="18" r="15.5"></circle>
              </svg>
              <span class="progress-text">${profile.collected}/${profile.total}</span>
            </span>
            <span class="meta">
              <span class="name">${profile.name}</span>
              <span class="role">${profile.code}</span>
            </span>
          </span>`;
        deck.append(card);
        return card;
      });

      const count = cards.length;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 3,
        target: 3,
        base: 3,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now()
      };

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function moveTo(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.base += delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", () => moveTo(index));
        card.addEventListener("focus", () => moveTo(index));
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        state.pointerX = nx;
        state.pointerY = ny;
        state.active = true;
        state.target = state.base + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
        state.lastInput = performance.now();
        stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);
      });

      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.pointerX = 0;
        state.pointerY = 0;
        state.target = state.base;
        stage.style.setProperty("--pointer-x", "50%");
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
        if (!direction) return;
        state.base += direction;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }, { passive: false });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      });

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.001, deltaTime / 1000);

        if (!state.active && time - state.lastInput > 3600) {
          const idle = time - state.lastInput - 3600;
          state.target = state.base + Math.sin(idle * 0.00042) * 2.45;
        }

        state.phase += (state.target - state.phase) * ease;
        const compact = innerWidth < 650;
        const activeIndex = nearestIndex();
        const horizontalSpacing = Math.min(168, Math.max(112, innerWidth * 0.116));
        const verticalSpacing = Math.min(122, Math.max(88, innerHeight * 0.112));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);
          const x = compact
            ? delta * 24 + Math.sin(delta * 0.9) * 25
            : delta * horizontalSpacing;
          const y = compact
            ? delta * verticalSpacing
            : distance * 8 + state.pointerY * focus * 10;
          const z = focus * 145 - distance * 148;
          const scale = 0.54 + side * 0.15 + focus * 0.54;
          const rotateX = compact ? delta * 2.1 : -state.pointerY * focus * 3.5;
          const rotateY = compact
            ? -delta * 5
            : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 3;
          const rotateZ = compact ? delta * -1.4 : delta * 0.7;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          card.style.filter = `blur(${Math.max(0, distance - 1.5) * 0.38}px)`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
